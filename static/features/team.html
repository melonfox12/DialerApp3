            <section id="teamPanel" class="metrics-panel dialer-run-panel" aria-labelledby="teamTitle" hidden>
              <div id="teamTabPanel" class="dashboard-tab-panel team-tab-panel" role="tabpanel" aria-labelledby="teamTabButton" hidden>
                <div class="dialer-document team-document">
                  <div id="teamRosterView" class="team-roster-view">
                  <header class="team-header">
                    <div>
                      <h2 id="teamTitle">Team</h2>
                      <p id="teamOrgSubtitle" class="team-subtitle">Roster and live activity</p>
                    </div>
                    <form id="teamInviteForm" class="team-invite" autocomplete="off">
                      <label class="form-field team-invite-field">
                        <span>Invite rep</span>
                        <input id="teamInviteEmail" type="email" name="email" placeholder="rep@company.com" required>
                      </label>
                      <button class="button button-secondary" type="submit">Send invite</button>
                    </form>
                  </header>
                  <div class="table-scroll team-table-scroll" role="region" aria-label="Team roster" tabindex="0">
                    <table id="teamTable" class="team-table">
                      <thead>
                        <tr>
                          <th scope="col">Member</th>
                          <th scope="col">Role</th>
                          <th scope="col">Status</th>
                          <th scope="col">Activity</th>
                          <th scope="col">App (UTC day)</th>
                          <th scope="col">Dials today</th>
                        </tr>
                      </thead>
                      <tbody id="teamTableBody"></tbody>
                    </table>
                    <div id="teamEmpty" class="empty-state" hidden>
                      <h2>No team members yet</h2>
                      <p>Run the org bootstrap script or invite a rep by email.</p>
                    </div>
                  </div>
                  </div>
                  <section id="teamMemberDetail" class="team-member-workspace team-page-overlay" hidden aria-live="polite">
                    <header class="team-workspace-header performance-header">
                      <div>
                        <div class="eyebrow">TEAM MEMBER</div>
                        <h2 id="teamMemberDetailTitle">Member</h2>
                      </div>
                      <button id="teamMemberDetailClose" type="button" class="button button-secondary team-workspace-close">Back to team</button>
                    </header>
                    <div class="team-workspace-tabs performance-mode-control" role="tablist" aria-label="Member workspace">
                      <button id="teamMemberTabAnalytics" type="button" class="team-workspace-tab performance-mode-button" role="tab" aria-selected="true" aria-controls="teamMemberAnalyticsPanel">Analytics</button>
                      <button id="teamMemberTabSettings" type="button" class="team-workspace-tab performance-mode-button" role="tab" aria-selected="false" aria-controls="teamMemberSettingsPanel">Settings</button>
                    </div>
                    <div id="teamMemberAnalyticsPanel" class="team-workspace-panel" role="tabpanel" aria-labelledby="teamMemberTabAnalytics">
                      <div id="teamMemberUsageRow" class="team-usage-row"></div>
                      <p id="teamMemberLiveLine" class="team-detail-live" role="status"></p>
                      <section class="team-chart-section performance-chart-section">
                      <div class="team-chart-toolbar performance-chart-toolbar">
                        <label class="form-field team-chart-span-field"><span id="teamMemberRangeLabel">Range</span><select id="teamMemberChartRange" aria-labelledby="teamMemberRangeLabel"></select></label>
                        <div class="team-chart-view-tabs performance-mode-control" role="tablist" aria-label="Chart type">
                          <button type="button" class="team-chart-view-tab performance-mode-button active" data-chart-view="activity" role="tab" aria-selected="true">Outbound</button>
                          <button type="button" class="team-chart-view-tab performance-mode-button" data-chart-view="dispositions" role="tab" aria-selected="false">Dispositions</button>
                          <button type="button" class="team-chart-view-tab performance-mode-button" data-chart-view="timeline" role="tab" aria-selected="false">Over time</button>
                        </div>
                      </div>
                      <div id="teamMemberChartHost" class="team-chart-host" aria-live="polite"></div>
                      </section>
                      <div id="teamMemberDetailExtras" class="team-detail-extras"></div>
                    </div>
                    <div id="teamMemberSettingsPanel" class="team-workspace-panel" role="tabpanel" aria-labelledby="teamMemberTabSettings" hidden>
                      <form id="teamMemberSettingsForm" class="team-member-settings-form">
                        <div id="teamMemberSettingsBody"></div>
                        <div class="dialog-actions"><button type="submit" class="button button-primary">Save member settings</button></div>
                      </form>
                    </div>
                  </section>
                </div>
              </div>
            </section>
